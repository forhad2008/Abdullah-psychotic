<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products — Abdullah Psychotic</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --red:#d20f1d;
  --red-dark:#9e0914;
  --bg:#050505;
  --card:#101010;
  --muted:#8c8c8c;
  --white:#f5f5f5;
  --border:rgba(255,255,255,.12);
  --heading:"Playfair Display",serif;
  --subheading:"Cinzel",serif;
  --body:"Montserrat",sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  background:
    radial-gradient(circle at 50% 20%,rgba(110,0,0,.08),transparent 35%),
    #050505;
  color:var(--white);
  font-family:var(--body);
  overflow-x:hidden;
}

a{text-decoration:none;color:inherit}

button{font-family:inherit}

::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-track{background:#050505}
::-webkit-scrollbar-thumb{background:var(--red);border-radius:10px}

/* =========================
   HEADER
========================= */
header{
  position:sticky;
  top:0;
  z-index:1000;
  height:112px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 46px;
  background:rgba(0,0,0,.94);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
}

.menu-btn{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:28px;
  cursor:pointer;
  transition:.25s;
}

.menu-btn:hover{color:var(--red)}

.logo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  line-height:1;
}

.logo-main{
  display:block;
  font-family:var(--body);
  font-size:30px;
  font-weight:500;
  letter-spacing:13px;
  margin-left:13px;
  color:#fff;
}

.logo-sub{
  display:block;
  margin-top:10px;
  color:var(--red);
  font-family:var(--body);
  font-size:22px;
  font-weight:500;
  letter-spacing:9px;
  margin-left:9px;
}

.cart-btn{
  position:relative;
  width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:29px;
  cursor:pointer;
  transition:.25s;
}

.cart-btn:hover{color:var(--red)}

.cart-count{
  position:absolute;
  top:0;
  right:-2px;
  min-width:21px;
  height:21px;
  padding:0 5px;
  border-radius:50%;
  background:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:10px;
  font-weight:700;
}

/* =========================
   PAGE TITLE
========================= */
.products-page{
  width:min(100%,1100px);
  margin:0 auto;
  padding:30px 28px 90px;
}

.page-title{
  text-align:center;
  font-family:var(--heading);
  font-size:46px;
  font-weight:500;
  letter-spacing:1px;
  margin:0 0 14px;
}

.title-decoration{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:38px;
}

.title-decoration span{
  display:block;
  width:74px;
  height:2px;
  background:var(--red);
}

.title-decoration i{
  color:var(--red);
  font-size:18px;
}

/* =========================
   PRODUCT LIST
========================= */
.product-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.product-card{
  min-height:300px;
  display:grid;
  grid-template-columns:44% 56%;
  overflow:hidden;
  background:
    radial-gradient(circle at 25% 50%,rgba(255,255,255,.035),transparent 42%),
    linear-gradient(135deg,#111 0%,#0c0c0c 100%);
  border:1px solid var(--border);
  border-radius:20px;
  transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;
}

.product-card:hover{
  transform:translateY(-2px);
  border-color:rgba(210,15,29,.38);
  box-shadow:0 18px 45px rgba(0,0,0,.5);
}

.product-image{
  position:relative;
  min-height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  overflow:hidden;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.045),transparent 60%);
}

.product-image::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 70%,rgba(0,0,0,.18));
  pointer-events:none;
}

.product-image img{
  width:100%;
  height:270px;
  object-fit:contain;
  position:relative;
  z-index:1;
  filter:drop-shadow(0 15px 20px rgba(0,0,0,.6));
  transition:transform .5s ease;
}

.product-card:hover .product-image img{
  transform:scale(1.035);
}

.product-info{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:34px 52px 34px 20px;
}

.product-badge{
  color:var(--red);
  font-size:13px;
  font-weight:500;
  letter-spacing:.8px;
  text-transform:uppercase;
  margin-bottom:12px;
}

.product-name{
  font-family:var(--heading);
  font-size:27px;
  line-height:1.25;
  font-weight:500;
  margin-bottom:11px;
}

.product-description{
  color:#9a9a9a;
  font-size:17px;
  line-height:1.85;
  margin-bottom:15px;
}

.product-price{
  color:#f22935;
  font-size:27px;
  font-weight:500;
  margin-bottom:18px;
}

.add-btn{
  width:255px;
  max-width:100%;
  height:52px;
  border:0;
  border-radius:8px;
  background:linear-gradient(180deg,#ed2935 0%,#c30c17 100%);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 8px 20px rgba(193,18,31,.12);
}

.add-btn:hover{
  background:linear-gradient(180deg,#ff3441 0%,#a90812 100%);
  transform:translateY(-1px);
  box-shadow:0 10px 25px rgba(193,18,31,.24);
}

.add-btn i{font-size:21px}

.sold-out{
  width:255px;
  max-width:100%;
  height:52px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.15);
  background:#eee;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:700;
  letter-spacing:1.5px;
}

/* =========================
   CART DRAWER
========================= */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(5px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:1100;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

.cart-drawer{
  position:fixed;
  top:0;
  right:-420px;
  width:390px;
  max-width:92vw;
  height:100dvh;
  background:#0a0a0a;
  border-left:1px solid var(--border);
  z-index:1200;
  display:flex;
  flex-direction:column;
  padding:25px;
  transition:right .4s cubic-bezier(.77,0,.175,1);
}

.cart-drawer.active{right:0}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:18px;
  border-bottom:1px solid var(--border);
}

.cart-header h2{
  font-family:var(--subheading);
  font-size:16px;
  letter-spacing:2px;
}

.close{
  color:#999;
  font-size:20px;
  cursor:pointer;
}

.close:hover{color:#fff}

.cart-items{
  flex:1;
  overflow-y:auto;
  padding:18px 0;
}

.empty{
  text-align:center;
  color:#777;
  margin-top:50px;
  font-family:var(--heading);
}

.cart-item{
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px;
  margin-bottom:12px;
  border:1px solid var(--border);
  background:#111;
  border-radius:7px;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:contain;
  background:#0b0b0b;
  border-radius:5px;
}

.cart-item-info{flex:1}

.cart-item-name{
  font-family:var(--heading);
  font-size:13px;
  line-height:1.3;
}

.cart-item-price{
  color:var(--red);
  font-size:13px;
  margin-top:5px;
}

.qty{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:8px;
}

.qty button{
  width:24px;
  height:24px;
  border:1px solid var(--border);
  background:#191919;
  color:#fff;
  cursor:pointer;
}

.remove{
  color:#777;
  cursor:pointer;
}

.remove:hover{color:var(--red)}

.cart-footer{
  border-top:1px solid var(--border);
  padding-top:18px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-family:var(--subheading);
  font-size:15px;
  margin-bottom:16px;
}

.checkout{
  width:100%;
  height:48px;
  border:0;
  background:var(--red);
  color:#fff;
  font-weight:600;
  letter-spacing:2px;
  cursor:pointer;
}

/* =========================
   MOBILE
========================= */
@media(max-width:768px){

  }

    margin-bottom:16px;
  }

    width:100%;

    font-size:15px;
  }

@media(max-width:480px){

    font-size:17px;

  }

  .products-page{
    padding:25px 18px 60px;
  }

  .page-title{
    font-size:32px;
  }

  .product-card{
    min-height:260px;
    grid-template-columns:43% 57%;
  }

  .product-image{min-height:260px}

  .product-image img{height:220px}

  .product-info{
    padding:22px 14px 22px 7px;
  }

  .product-badge{font-size:9px}

  .product-name{font-size:17px}

  .product-description{
    font-size:12px;
    line-height:1.75;
  }

  .product-price{
    font-size:21px;
  }

  .add-btn,.sold-out{
    height:45px;
    font-size:12px;
    gap:8px;
  }

  .add-btn i{font-size:16px}
}
</style>
</head>

/* Same sold-out IDs from your current website */
const soldOut = [1,2];

let cart = JSON.parse(localStorage.getItem("ap_user_cart")) || [];

function saveCart(){
  localStorage.setItem("ap_user_cart",JSON.stringify(cart));
}

function renderProducts(){
  const list = document.getElementById("product-list");

  list.innerHTML = products.map(product => {
    const sold = soldOut.includes(product.id);

    return `
      <article class="product-card">
        <a class="product-image" href="${product.image}" target="_blank">
          <img src="${product.image}" alt="${product.name}" loading="lazy">
        </a>

        <div class="product-info">
          <div class="product-badge">${product.badge}</div>
          <h2 class="product-name">${product.name}</h2>
          <p class="product-description">${product.desc}</p>
          <div class="product-price">$${product.price.toLocaleString()}</div>

          ${
            sold
            ? `<div class="sold-out">SOLD OUT</div>`
            : `<button class="add-btn" onclick="addToCart(${product.id})">
                 <i class="fas fa-cart-shopping"></i>
                 ADD TO CART
               </button>`
          }
        </div>
      </article>
    `;
  }).join("");
}

function addToCart(id){
  const product = products.find(p => p.id === id);
  if(!product) return;

  const existing = cart.find(item => item.id === id);

  if(existing){
    existing.qty++;
  }else{
    cart.push({...product,qty:1});
  }

  saveCart();
  updateCart();
  openCart();
}

function changeQty(id,amount){
  const item = cart.find(p => p.id === id);
  if(!item) return;

  item.qty += amount;

  if(item.qty <= 0){
    cart = cart.filter(p => p.id !== id);
  }

  saveCart();
  updateCart();
}

function removeItem(id){
  cart = cart.filter(p => p.id !== id);
  saveCart();
  updateCart();
}

function updateCart(){
  const count = cart.reduce((sum,item)=>sum+item.qty,0);
  document.getElementById("cart-count").textContent = count;

  const subtotal = cart.reduce((sum,item)=>sum+(item.price*item.qty),0);
  document.getElementById("subtotal").textContent = "$" + subtotal.toLocaleString();

  const box = document.getElementById("cart-items");

  if(!cart.length){
    box.innerHTML = `<div class="empty">Your shopping bag is empty.</div>`;
    return;
  }

  box.innerHTML = cart.map(item => `
    <div class="cart-item">
      <img src="${item.image}" alt="${item.name}">
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">$${item.price.toLocaleString()}</div>
        <div class="qty">
          <button onclick="changeQty(${item.id},-1)">−</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${item.id},1)">+</button>
        </div>
      </div>
      <i class="fas fa-trash remove" onclick="removeItem(${item.id})"></i>
    </div>
  `).join("");
}

function openCart(){
  document.getElementById("cart-drawer").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  document.body.style.overflow="hidden";
}

function closeCart(){
  document.getElementById("cart-drawer").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
  document.body.style.overflow="";
}

function checkout(){
  if(!cart.length){
    alert("Your cart is empty!");
    return;
  }

  alert("Your existing checkout system can be connected here.");
}

renderProducts();
updateCart();
</script>
