<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop — Abdullah Psychotic</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --red:#d20f1d;
  --red-dark:#9e0914;
  --bg:#050505;
  --card:#101010;
  --muted:#8c8c8c;
  --white:#f5f5f5;
  --cream:#faf8ed;
  --black:#050505;
  --border:rgba(255,255,255,.12);

  --heading:"Playfair Display",serif;
  --subheading:"Cinzel",serif;
  --body:"Montserrat",sans-serif;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#e8e5de;
  color:#202328;
  font-family:var(--body);
  overflow-x:hidden;
}

body.locked{
  overflow:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
}

img{
  max-width:100%;
  display:block;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
  width:7px;
}

::-webkit-scrollbar-track{
  background:#050505;
}

::-webkit-scrollbar-thumb{
  background:var(--red);
  border-radius:10px;
}


/* =========================================================
   HEADER - PREVIOUS BLACK STYLE
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:1000;

  height:86px;

  display:grid;
  grid-template-columns:70px 1fr 70px;
  align-items:center;

  background:rgba(5,5,5,.97);
  border-bottom:1px solid rgba(255,255,255,.10);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.menu-btn,
.cart-btn{
  position:relative;

  width:38px;
  height:38px;

  margin:auto;

  padding:0;
  border:0;

  background:transparent;
  color:#f5f5f5;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:.2s;

  -webkit-tap-highlight-color:transparent;
}

.menu-btn:hover,
.cart-btn:hover{
  transform:scale(1.08);
}

.menu-btn:active,
.cart-btn:active{
  transform:scale(.92);
}

.menu-btn svg,
.cart-btn svg{
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.menu-btn svg{
  width:25px;
  height:20px;
}

.cart-btn svg{
  width:23px;
  height:23px;
}

.logo{
  justify-self:center;

  display:flex;
  align-items:center;
  justify-content:center;

  width:150px;
}

.logo img{
  width:115px;
  height:auto;
  max-height:70px;

  object-fit:contain;
}

.cart-count{
  position:absolute;

  top:-3px;
  right:-5px;

  min-width:17px;
  width:17px;
  height:17px;

  border-radius:50%;

  background:var(--red);
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:8px;
  font-weight:700;

  border:1px solid #000;
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.72);

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:.3s;

  z-index:1100;
}

.overlay.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}


/* =========================================================
   MENU DRAWER
========================================================= */

.menu-drawer{
  position:fixed;
  top:0;
  left:-380px;

  width:350px;
  max-width:88vw;
  height:100dvh;

  z-index:1300;

  background:#090909;

  border-right:1px solid var(--border);

  box-shadow:18px 0 55px rgba(0,0,0,.5);

  padding:28px;

  display:flex;
  flex-direction:column;

  transition:left .42s cubic-bezier(.77,0,.175,1);
}

.menu-drawer.active{
  left:0;
}

.menu-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding-bottom:22px;

  border-bottom:1px solid var(--border);
}

.menu-brand{
  color:#fff;

  font-family:var(--subheading);
  font-size:11px;
  letter-spacing:2px;
}

.menu-close{
  width:40px;
  height:40px;

  border:1px solid var(--border);
  border-radius:50%;

  background:#111;
  color:#aaa;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  cursor:pointer;
}

.menu-close:hover{
  color:#fff;
  border-color:var(--red);
}

.menu-links{
  display:flex;
  flex-direction:column;

  gap:5px;

  padding-top:24px;
}

.menu-links a{
  padding:15px 14px;

  color:#bbb;

  border-radius:8px;

  font-size:12px;
  letter-spacing:1.5px;

  transition:.25s;
}

.menu-links a:hover{
  color:#fff;
  background:rgba(210,15,29,.1);
  padding-left:18px;
}

.menu-bottom{
  margin-top:auto;

  color:#555;

  text-align:center;

  font-size:9px;
  letter-spacing:2px;
}


/* =========================================================
   PRODUCTS PAGE
========================================================= */

.products-page{
  width:100%;
  max-width:1450px;

  margin:auto;

  padding:22px 16px 70px;
}


/* =========================================================
   PRODUCT GRID
========================================================= */

.product-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:14px;
}


/* =========================================================
   PRODUCT CARD
   SHORTER FULL BOX
========================================================= */

.product-card{
  position:relative;

  min-width:0;

  overflow:hidden;

  background:#f5f4f1;

  box-shadow:
    0 2px 8px rgba(0,0,0,.04),
    0 8px 20px rgba(0,0,0,.04);

  transition:.25s;
}

.product-card:hover{
  transform:translateY(-2px);
}


/* =========================================================
   IMAGE
   SHORTER THAN PREVIOUS VERSION
========================================================= */

.product-image{
  position:relative;

  width:100%;
  height:330px;

  overflow:hidden;

  background:#111;

  display:block;
}

.product-image img{
  width:100%;
  height:100%;

  object-fit:cover;

  transition:.4s;
}

.product-card:hover .product-image img{
  transform:scale(1.025);
}


/* =========================================================
   LIMITED BADGE
========================================================= */

.product-badge{
  position:absolute;

  top:14px;
  left:14px;

  min-width:145px;
  height:36px;

  padding:0 13px;

  background:#f4f4f2;
  color:#25282c;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:9px;
  font-weight:600;

  letter-spacing:2.7px;
  text-transform:uppercase;

  z-index:3;
}


/* =========================================================
   WHITE PLUS BUTTON / BLACK PLUS
========================================================= */

.plus-btn{
  position:absolute;

  right:14px;
  bottom:14px;

  width:64px;
  height:64px;

  border:0;

  background:#ffffff;
  color:#111111;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  z-index:5;

  font-size:40px;
  font-weight:300;
  line-height:1;

  transition:.2s;

  box-shadow:0 5px 16px rgba(0,0,0,.14);
}

.plus-btn:hover{
  background:#111;
  color:#fff;
}

.plus-btn:active{
  transform:scale(.92);
}


/* =========================================================
   PRODUCT INFO - SHORT HEIGHT
========================================================= */

.product-info{
  min-height:156px;

  padding:20px 20px 19px;

  background:#f7f7f6;

  display:flex;
  flex-direction:column;
}

.product-brand{
  color:#6e7276;

  font-family:var(--subheading);

  font-size:9px;
  font-weight:600;

  letter-spacing:2px;

  text-transform:uppercase;

  margin-bottom:13px;
}

.product-name{
  color:#2e3236;

  font-family:var(--body);

  font-size:17px;
  font-weight:400;

  line-height:1.35;

  margin-bottom:12px;
}

.product-price{
  margin-top:auto;

  color:#292d31;

  font-size:16px;
  font-weight:700;

  letter-spacing:.7px;
}

.sold-label{
  position:absolute;

  right:14px;
  bottom:14px;

  height:50px;
  min-width:110px;

  background:#111;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:9px;
  font-weight:700;
  letter-spacing:2px;

  z-index:5;
}


/* =========================================================
   CART
========================================================= */

.cart-drawer{
  position:fixed;
  inset:0 0 0 auto;

  width:min(430px,80vw);
  height:100dvh;

  background:#090909;

  border-left:1px solid var(--border);

  z-index:1300;

  display:flex;
  flex-direction:column;

  transform:translateX(100%);

  transition:transform .38s cubic-bezier(.77,0,.175,1);

  box-shadow:-18px 0 55px rgba(0,0,0,.55);
}

.cart-drawer.active{
  transform:translateX(0);
}

.cart-header{
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  min-height:76px;

  padding:0 22px;

  border-bottom:1px solid var(--border);

  background:#0b0b0b;
}

.cart-header h2{
  color:#fff;

  font-family:var(--subheading);

  font-size:15px;
  letter-spacing:2.5px;
}

.cart-close{
  width:40px;
  height:40px;

  border:1px solid var(--border);

  background:#fff;
  color:#050505;

  font-size:24px;
  cursor:pointer;

  transition:.2s;
}

.cart-close:hover{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}

.cart-items{
  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:18px 22px;
}

.empty{
  text-align:center;

  color:#777;

  margin-top:70px;

  font-family:var(--heading);
  font-size:15px;
}

.cart-item{
  display:grid;

  grid-template-columns:72px minmax(0,1fr) 34px;

  gap:12px;

  align-items:center;

  padding:10px 0;

  border-bottom:1px solid var(--border);
}

.cart-item img{
  width:72px;
  height:82px;

  object-fit:cover;

  background:#101010;
}

.cart-item-info{
  min-width:0;
}

.cart-item-name{
  color:#fff;

  font-family:var(--heading);

  font-size:12px;
  line-height:1.35;
}

.cart-item-size{
  color:#aaa;

  font-size:10px;

  margin-top:5px;
  letter-spacing:.8px;
}

.cart-item-price{
  color:#f22935;

  font-size:12px;
  font-weight:600;

  margin-top:6px;
}

.qty{
  display:flex;
  align-items:center;

  gap:8px;

  margin-top:10px;
}

.qty button{
  width:27px;
  height:27px;

  border:1px solid var(--border);

  background:#111;
  color:#fff;

  cursor:pointer;
}

.qty button:hover{
  border-color:var(--red);
  color:var(--red);
}

.qty span{
  color:#fff;

  min-width:14px;

  text-align:center;
  font-size:11px;
}

.remove{
  align-self:start;

  width:34px;
  height:34px;

  border:1px solid var(--border);

  background:#111;
  color:#aaa;

  font-size:21px;
  cursor:pointer;
}

.remove:hover{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}

.cart-footer{
  flex-shrink:0;

  border-top:1px solid var(--border);

  padding:18px 22px 22px;

  background:#0b0b0b;
}

.total{
  display:flex;
  align-items:center;
  justify-content:space-between;

  color:#fff;

  font-family:var(--subheading);

  font-size:14px;
  letter-spacing:.5px;

  margin-bottom:15px;
}

.checkout{
  width:100%;
  height:52px;

  border:1px solid var(--red);

  background:var(--red);
  color:#fff;

  font-weight:700;
  letter-spacing:2px;

  cursor:pointer;

  transition:.2s;
}

.checkout:hover{
  background:#fff;
  color:#050505;
  border-color:#fff;
}


/* =========================================================
   OPTIONS MODAL
========================================================= */

.options-overlay{
  position:fixed;
  inset:0;

  z-index:2000;

  background:rgba(0,0,0,.72);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:.25s;
}

.options-overlay.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.options-window{
  position:fixed;

  left:50%;
  bottom:0;

  transform:translate(-50%,105%);

  width:min(720px,100%);

  max-height:92dvh;

  background:var(--cream);

  color:#171717;

  z-index:2100;

  border-radius:22px 22px 0 0;

  overflow:hidden;

  box-shadow:0 -20px 70px rgba(0,0,0,.5);

  transition:transform .42s cubic-bezier(.77,0,.175,1);

  display:flex;
  flex-direction:column;
}

.options-overlay.active .options-window{
  transform:translate(-50%,0);
}

.options-header{
  flex:0 0 auto;

  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 30px;

  border-bottom:1px solid rgba(0,0,0,.12);
}

.options-header h2{
  font-family:var(--subheading);

  font-size:19px;
  font-weight:500;

  letter-spacing:3px;
}

.options-close{
  width:44px;
  height:44px;

  border:0;

  background:transparent;

  color:#171717;

  font-size:34px;
  cursor:pointer;
}

.options-body{
  overflow-y:auto;

  padding:22px 30px 30px;
}

.option-product{
  display:grid;

  grid-template-columns:170px 1fr;

  gap:25px;

  align-items:center;

  margin-bottom:24px;
}

.option-image{
  width:170px;
  height:190px;

  background:#111;

  overflow:hidden;
}

.option-image img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.option-product-info h3{
  font-family:var(--heading);

  font-size:22px;
  font-weight:500;

  line-height:1.25;

  margin-bottom:8px;
}

.option-price{
  color:#555;

  font-size:15px;

  letter-spacing:2px;

  margin-bottom:14px;
}

.option-label{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:9px;
}

.option-label span:first-child{
  font-size:15px;

  font-weight:500;

  letter-spacing:1px;
}

.size-chart{
  color:#222;

  font-size:12px;

  text-decoration:underline;

  cursor:pointer;
}

.size-options{
  display:flex;
  flex-wrap:wrap;

  gap:8px;
}

.size-btn{
  min-width:58px;
  height:45px;

  padding:0 13px;

  border:1px solid #c9c7bc;

  background:transparent;

  color:#555;

  font-size:13px;
  cursor:pointer;
}

.size-btn.selected{
  background:#050505;

  border-color:#050505;

  color:#fff;
}

.confirm-add{
  width:100%;
  height:53px;

  border:0;

  background:#050505;
  color:#fff;

  font-size:14px;
  letter-spacing:3px;

  font-weight:500;
  cursor:pointer;
}

.confirm-add:disabled{
  opacity:.35;
  cursor:not-allowed;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:769px){

  .products-page{
    padding:30px 25px 80px;
  }

  .product-list{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:20px;
  }

  .product-image{
    height:400px;
  }

  .product-info{
    min-height:145px;
  }

  .product-name{
    font-size:17px;
  }

  .options-window{
    bottom:50%;

    transform:translate(-50%,50%);

    width:650px;

    border-radius:18px;
  }

  .options-overlay.active .options-window{
    transform:translate(-50%,50%);
  }
}


@media(min-width:1200px){

  .product-list{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .product-image{
    height:370px;
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

  header{
    height:80px;

    grid-template-columns:50px 1fr 50px;

    padding:0 6px;
  }

  .menu-btn,
  .cart-btn{
    width:29px;
    height:29px;
  }

  .menu-btn svg{
    width:25px;
    height:19px;
  }

  .cart-btn svg{
    width:18px;
    height:18px;
  }

  .logo img{
    width:100px;
    max-height:62px;
  }

  .cart-count{
    min-width:15px;
    width:15px;
    height:15px;

    font-size:7px;

    top:-3px;
    right:-5px;
  }

  .products-page{
    padding:16px 15px 60px;
  }

  .product-list{
    gap:12px;
  }

  /* SHORTER MOBILE IMAGE */

  .product-image{
    height:235px;
  }

  .product-badge{
    top:10px;
    left:10px;

    min-width:112px;
    height:31px;

    padding:0 8px;

    font-size:7px;

    letter-spacing:1.8px;
  }

  .plus-btn{
    width:54px;
    height:54px;

    right:10px;
    bottom:10px;

    font-size:35px;
  }

  /* SHORT FULL PRODUCT BOX */

  .product-info{
    min-height:132px;

    padding:15px 13px 15px;
  }

  .product-brand{
    font-size:7px;

    letter-spacing:1.4px;

    margin-bottom:9px;
  }

  .product-name{
    font-size:12px;

    line-height:1.32;

    margin-bottom:9px;
  }

  .product-price{
    font-size:13px;
  }

  /* CART */

  .cart-drawer{
    width:100vw;
  }

  .cart-header{
    min-height:68px;
    padding:0 16px;
  }

  .cart-items{
    padding:14px 16px;
  }

  .cart-footer{
    padding:16px;
  }

  /* OPTIONS */

  .options-window{
    width:100%;

    max-height:91dvh;

    border-radius:20px 20px 0 0;
  }

  .options-header{
    height:72px;

    padding:0 20px;
  }

  .options-header h2{
    font-size:16px;

    letter-spacing:2.5px;
  }

  .options-close{
    width:40px;
    height:40px;

    font-size:31px;
  }

  .options-body{
    padding:18px;
  }

  .option-product{
    grid-template-columns:105px 1fr;

    gap:14px;

    margin-bottom:18px;
  }

  .option-image{
    width:105px;
    height:125px;
  }

  .option-product-info h3{
    font-size:15px;

    line-height:1.3;

    margin-bottom:6px;
  }

  .option-price{
    font-size:12px;

    letter-spacing:1px;

    margin-bottom:11px;
  }

  .option-label span:first-child{
    font-size:12px;
  }

  .size-options{
    gap:6px;
  }

  .size-btn{
    min-width:43px;

    height:37px;

    padding:0 8px;

    font-size:10px;
  }

  .confirm-add{
    height:49px;

    font-size:11px;

    letter-spacing:2px;
  }

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:380px){

  .products-page{
    padding-left:10px;
    padding-right:10px;
  }

  .product-list{
    gap:10px;
  }

  .product-image{
    height:210px;
  }

  .product-badge{
    min-width:95px;
    height:28px;

    font-size:6px;
    letter-spacing:1.4px;
  }

  .plus-btn{
    width:48px;
    height:48px;

    font-size:31px;
  }

  .product-info{
    min-height:122px;

    padding:13px 10px;
  }

  .product-brand{
    font-size:6px;
  }

  .product-name{
    font-size:10px;
  }

  .product-price{
    font-size:12px;
  }

}


/* =========================================================
   FINAL CART FIX
========================================================= */

#cart-drawer.cart-drawer{
  position:fixed !important;
  top:0 !important;
  right:0 !important;
  bottom:0 !important;
  left:auto !important;
  z-index:9999 !important;
  display:flex !important;
  visibility:visible !important;
  transform:translateX(100%) !important;
}

#cart-drawer.cart-drawer.active{
  transform:translateX(0) !important;
}

#cart-overlay{
  z-index:9998 !important;
}

</style>
</head>

<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

  <button
    class="menu-btn"
    aria-label="Open menu"
    onclick="openMenu()"

/* =========================================================

========================================================= */

const soldOut = [];


/* =========================================================
   CART
========================================================= */

let cart =
  JSON.parse(
    localStorage.getItem("ap_user_cart")
  ) || [];


let optionProduct = null;
let selectedSize = null;


/* =========================================================
   SIZE OPTIONS
========================================================= */

function getOptions(product){

  if(
    product.category === "apparel" ||
    product.category === "hoodies"
  ){

    return {
      label:"SIZE",
      values:["S","M","L","XL","XXL"]
    };

  }


  if(product.category === "footwear"){

    return {
      label:"SIZE",
      values:["39","40","41","42","43","44","45"]
    };

  }


  return {
    label:"SIZE",
    values:["ONE SIZE"]
  };

}


/* =========================================================
   SAVE CART
========================================================= */

function saveCart(){

  localStorage.setItem(
    "ap_user_cart",
    JSON.stringify(cart)
  );

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

  const list =
    document.getElementById("product-list");


  list.innerHTML =
    products.map(product => {

      const sold =
        soldOut.includes(product.id);


      return `

        <article class="product-card">

          <a
            class="product-image"
            href="${product.url}"
            target="_blank"
          >

            <img
              src="${product.image}"
              alt="${product.name}"
              loading="lazy"
            >

            <div class="product-badge">
              ${product.badge}
            </div>

          </a>


          ${
            sold

            ?

            `
              <div class="sold-label">
                SOLD OUT
              </div>
            `

            :

            `
              <button
                class="plus-btn"
                onclick="openOptions(${product.id})"
                aria-label="Add to cart"
              >
                +
              </button>
            `
          }


          <div class="product-info">

            <div class="product-brand">
              ABDULLAH PSYCHOTIC
            </div>


            <h2 class="product-name">
              ${product.name}
            </h2>


            <div class="product-price">
              $${product.price.toLocaleString()} USD
            </div>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================================================
   OPEN OPTIONS
========================================================= */

function openOptions(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;


  optionProduct = product;
  selectedSize = null;


  document.getElementById("option-image").src =
    product.image;

  document.getElementById("option-image").alt =
    product.name;

  document.getElementById("option-name").textContent =
    product.name;

  document.getElementById("option-price").textContent =
    "$" +
    product.price.toLocaleString() +
    " USD";


  const options =
    getOptions(product);


  document.getElementById("option-label").textContent =
    options.label;


  const sizeBox =
    document.getElementById("size-options");


  sizeBox.innerHTML =
    options.values.map(value => `

      <button
        class="size-btn"
        onclick="selectSize(this,'${value}')"
      >
        ${value}
      </button>

    `).join("");


  document.getElementById("confirm-add").disabled =
    true;


  document
    .getElementById("options-overlay")
    .classList.add("active");


  document.body.classList.add("locked");

}


/* =========================================================
   SELECT SIZE
========================================================= */

function selectSize(button,size){

  document
    .querySelectorAll(".size-btn")
    .forEach(btn => {

      btn.classList.remove("selected");

    });


  button.classList.add("selected");


  selectedSize = size;


  document
    .getElementById("confirm-add")
    .disabled = false;

}


/* =========================================================
   CONFIRM ADD TO CART
========================================================= */

function confirmAddToCart(){

  if(!optionProduct || !selectedSize){
    return;
  }


  const existing =
    cart.find(
      item =>
        item.id === optionProduct.id &&
        item.size === selectedSize
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      ...optionProduct,

      size:selectedSize,

      qty:1

    });

  }


  saveCart();

  updateCart();

  closeOptions();

  openCart();

}


/* =========================================================
   CLOSE OPTIONS
========================================================= */

function closeOptions(){

  document
    .getElementById("options-overlay")
    .classList.remove("active");


  optionProduct = null;
  selectedSize = null;


  if(
    !document
      .getElementById("cart-drawer")
      .classList.contains("active")
    &&
    !document
      .getElementById("menu-drawer")
      .classList.contains("active")
  ){

    document.body.classList.remove("locked");

  }

}


/* =========================================================
   SIZE CHART
========================================================= */

function showSizeChart(){

  alert(
`SIZE GUIDE

S — Small
M — Medium
L — Large
XL — Extra Large
XXL — Extra Extra Large

For shoes:
39 / 40 / 41 / 42 / 43 / 44 / 45

Please choose your usual size.`
  );

}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

function changeQty(id,size,amount){

  const item =
    cart.find(
      p =>
        p.id === id &&
        p.size === size
    );


  if(!item) return;


  item.qty += amount;


  if(item.qty <= 0){

    cart =
      cart.filter(
        p =>
          !(
            p.id === id &&
            p.size === size
          )
      );

  }


  saveCart();
  updateCart();

}


/* =========================================================
   REMOVE ITEM
========================================================= */

function removeItem(id,size){

  cart =
    cart.filter(
      p =>
        !(
          p.id === id &&
          p.size === size
        )
    );


  saveCart();
  updateCart();

}


/* =========================================================
   UPDATE CART
========================================================= */

function updateCart(){

  const count =
    cart.reduce(
      (sum,item) => sum + item.qty,
      0
    );


  document.getElementById("cart-count").textContent =
    count;


  const subtotal =
    cart.reduce(
      (sum,item) =>
        sum + (item.price * item.qty),
      0
    );


  document.getElementById("subtotal").textContent =
    "$" + subtotal.toLocaleString();


  const box =
    document.getElementById("cart-items");


  if(!cart.length){

    box.innerHTML = `
      <div class="empty">
        Your shopping bag is empty.
      </div>
    `;

    return;

  }


  box.innerHTML =
    cart.map(item => `

      <div class="cart-item">

        <img
          src="${item.image}"
          alt="${item.name}"
        >


        <div class="cart-item-info">

          <div class="cart-item-name">
            ${item.name}
          </div>


          <div class="cart-item-size">
            SIZE: ${item.size}
          </div>


          <div class="cart-item-price">
            $${item.price.toLocaleString()}
          </div>


          <div class="qty">

            <button
              onclick="changeQty(${item.id},'${item.size}',-1)"
            >
              −
            </button>


            <span>
              ${item.qty}
            </span>


            <button
              onclick="changeQty(${item.id},'${item.size}',1)"
            >
              +
            </button>

          </div>

        </div>


        <button
          class="remove"
          onclick="removeItem(${item.id},'${item.size}')"
          aria-label="Remove item"
        >
          ×
        </button>

      </div>

    `).join("");

}

========================================================= */
