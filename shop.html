<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop — Abdullah Psychotic</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --red:#d20f1d;
  --red-dark:#970914;

  --bg:#050505;
  --card:#101010;
  --card-soft:#151515;

  --white:#f5f5f5;
  --muted:#8b8b8b;
  --muted-2:#666;

  --border:rgba(255,255,255,.10);
  --border-light:rgba(255,255,255,.15);

  --heading:"Playfair Display",serif;
  --subheading:"Cinzel",serif;
  --body:"Montserrat",sans-serif;
}

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(110,0,0,.10),
      transparent 35%
    ),
    #050505;

  color:var(--white);
  font-family:var(--body);
  overflow-x:hidden;
}

body.no-scroll{
  overflow:hidden;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{
  font-family:inherit;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  display:block;
  max-width:100%;
}

::-webkit-scrollbar{
  width:6px;
}

::-webkit-scrollbar-track{
  background:#050505;
}

::-webkit-scrollbar-thumb{
  background:var(--red);
  border-radius:20px;
}

/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:1000;

  width:100%;
  height:82px;

  display:grid;
  grid-template-columns:70px 1fr 70px;
  align-items:center;

  background:rgba(5,5,5,.94);
  border-bottom:1px solid var(--border);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.logo{
  justify-self:center;

  display:flex;
  align-items:center;
  justify-content:center;

  width:max-content;
}

.logo img{
  width:118px;
  height:auto;
  object-fit:contain;
}

/* =========================================================
   HEADER BUTTONS
========================================================= */

.menu-btn,
.cart-btn{
  position:relative;

  width:38px;
  height:38px;

  margin:auto;

  padding:0;

  border:0;
  background:transparent;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:
    transform .22s ease,
    opacity .22s ease;
}

.menu-btn:hover,
.cart-btn:hover{
  transform:scale(1.08);
}

.menu-btn:active,
.cart-btn:active{
  transform:scale(.88);
}

.menu-btn svg,
.cart-btn svg{
  width:23px;
  height:23px;

  fill:none;
  stroke:currentColor;

  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================================================
   CART COUNT
========================================================= */

.cart-count{
  position:absolute;

  top:-4px;
  right:-6px;

  min-width:18px;
  height:18px;

  padding:0 4px;

  border-radius:50%;

  background:var(--red);
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:8px;
  font-weight:700;

  line-height:1;

  border:1px solid #050505;

  transition:
    transform .2s ease,
    background .2s ease;
}

.cart-count.bump{
  animation:cartBump .35s ease;
}

@keyframes cartBump{
  0%{transform:scale(1)}
  50%{transform:scale(1.35)}
  100%{transform:scale(1)}
}

/* =========================================================
   MENU DRAWER
========================================================= */

.menu-drawer{
  position:fixed;

  top:0;
  left:-370px;

  width:350px;
  max-width:88vw;

  height:100dvh;

  z-index:1200;

  padding:28px;

  background:
    linear-gradient(
      145deg,
      rgba(15,15,15,.99),
      rgba(5,5,5,.99)
    );

  border-right:1px solid var(--border);

  box-shadow:
    20px 0 60px rgba(0,0,0,.45);

  display:flex;
  flex-direction:column;

  transition:
    left .42s cubic-bezier(.77,0,.175,1);
}

.menu-drawer.active{
  left:0;
}

.menu-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding-bottom:20px;

  border-bottom:1px solid var(--border);
}

.menu-brand{
  font-family:var(--subheading);

  font-size:11px;
  letter-spacing:2px;

  color:#eee;
}

.menu-close{
  width:40px;
  height:40px;

  border:1px solid var(--border);
  border-radius:50%;

  background:#111;
  color:#aaa;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;
  font-weight:300;

  cursor:pointer;

  transition:.25s;
}

.menu-close:hover{
  color:#fff;
  border-color:var(--red);
  background:rgba(210,15,29,.08);
}

.menu-links{
  display:flex;
  flex-direction:column;

  gap:4px;

  padding-top:25px;
}

.menu-links a{
  display:flex;
  align-items:center;
  gap:14px;

  padding:15px 14px;

  color:#aaa;

  border-radius:8px;

  font-size:12px;
  letter-spacing:1.5px;

  transition:
    background .25s ease,
    color .25s ease,
    padding-left .25s ease;
}

.menu-links a span{
  flex:1;
}

.menu-links a:hover{
  color:#fff;

  background:rgba(210,15,29,.09);

  padding-left:18px;
}

.menu-icon{
  width:19px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--red);

  font-size:14px;
}

.menu-bottom{
  margin-top:auto;

  text-align:center;

  color:#555;

  font-size:9px;
  letter-spacing:2px;
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay{
  position:fixed;

  inset:0;

  z-index:1100;

  background:rgba(0,0,0,.78);

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:
    opacity .3s ease,
    visibility .3s ease;
}

.overlay.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

/* =========================================================
   PRODUCTS PAGE
========================================================= */

.products-page{
  width:min(100%,1100px);

  margin:0 auto;

  padding:
    38px
    25px
    100px;
}

.page-title{
  text-align:center;

  font-family:var(--heading);

  font-size:42px;
  font-weight:500;

  letter-spacing:1px;

  margin-bottom:10px;
}

.title-decoration{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:12px;

  margin-bottom:35px;
}

.title-decoration span{
  width:70px;
  height:1px;

  background:var(--red);
}

.title-decoration b{
  color:var(--red);

  font-size:22px;
  font-weight:400;

  transform:rotate(45deg);
}

/* =========================================================
   PRODUCT LIST
========================================================= */

.product-list{
  display:flex;
  flex-direction:column;

  gap:12px;
}

.product-card{
  min-height:180px;

  display:grid;

  grid-template-columns:46% 54%;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 25% 50%,
      rgba(255,255,255,.035),
      transparent 42%
    ),
    linear-gradient(
      135deg,
      #111,
      #090909
    );

  border:1px solid var(--border);

  border-radius:12px;

  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.product-card:hover{
  transform:translateY(-2px);

  border-color:rgba(210,15,29,.35);

  box-shadow:
    0 18px 40px rgba(0,0,0,.45);
}

/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image{
  position:relative;

  min-height:180px;

  padding:6px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.045),
      transparent 65%
    );
}

.product-image::after{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      90deg,
      transparent 70%,
      rgba(0,0,0,.18)
    );

  pointer-events:none;
}

.product-image img{
  position:relative;

  z-index:1;

  width:100%;
  height:170px;

  object-fit:contain;

  filter:
    drop-shadow(
      0 12px 18px rgba(0,0,0,.55)
    );

  transition:
    transform .4s ease;
}

.product-card:hover .product-image img{
  transform:scale(1.035);
}

/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{
  min-width:0;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:
    18px
    25px
    18px
    8px;
}

.product-badge{
  color:var(--red);

  font-size:8px;

  font-weight:600;

  letter-spacing:.6px;

  text-transform:uppercase;

  margin-bottom:7px;
}

.product-name{
  font-family:var(--heading);

  font-size:15px;

  font-weight:500;

  line-height:1.25;

  margin-bottom:7px;
}

.product-description{
  color:#8d8d8d;

  font-size:10px;

  line-height:1.55;

  margin-bottom:8px;
}

.product-price{
  color:#f22935;

  font-size:16px;

  font-weight:600;

  margin-bottom:10px;
}

/* =========================================================
   ADD BUTTON
========================================================= */

.add-btn{
  width:153px;
  height:31px;

  border:0;

  border-radius:5px;

  background:
    linear-gradient(
      180deg,
      #ed2935,
      #bd0d17
    );

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  font-size:10px;
  font-weight:600;

  letter-spacing:.3px;

  cursor:pointer;

  box-shadow:
    0 7px 16px rgba(193,18,31,.10);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.add-btn:hover{
  transform:translateY(-1px);

  filter:brightness(1.08);

  box-shadow:
    0 10px 22px rgba(193,18,31,.22);
}

.add-btn:active{
  transform:scale(.96);
}

.add-btn svg{
  width:15px;
  height:15px;

  fill:none;
  stroke:currentColor;

  stroke-width:2;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.sold-out{
  width:153px;
  height:31px;

  border:1px solid var(--border-light);

  border-radius:5px;

  background:#eee;
  color:#111;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:9px;
  font-weight:700;

  letter-spacing:1px;
}

/* =========================================================
   CART DRAWER
========================================================= */

.cart-drawer{
  position:fixed;

  top:0;
  right:-450px;

  width:420px;
  max-width:94vw;

  height:100dvh;

  z-index:1200;

  padding:27px;

  background:
    linear-gradient(
      145deg,
      rgba(15,15,15,.99),
      rgba(5,5,5,.99)
    );

  border-left:1px solid var(--border);

  box-shadow:
    -20px 0 60px rgba(0,0,0,.5);

  display:flex;
  flex-direction:column;

  transition:
    right .42s cubic-bezier(.77,0,.175,1);
}

.cart-drawer.active{
  right:0;
}

/* =========================================================
   CART HEADER
========================================================= */

.cart-header{
  flex:0 0 auto;

  display:flex;

  align-items:center;
  justify-content:space-between;

  padding-bottom:18px;

  border-bottom:1px solid var(--border);
}

.cart-header h2{
  font-family:var(--subheading);

  font-size:14px;

  font-weight:500;

  letter-spacing:2.5px;
}

.close-cart{
  width:40px;
  height:40px;

  border:1px solid var(--border);

  border-radius:50%;

  background:#111;

  color:#aaa;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:23px;

  cursor:pointer;

  transition:.25s;
}

.close-cart:hover{
  color:#fff;
  border-color:var(--red);
}

/* =========================================================
   CART ITEMS
========================================================= */

.cart-items{
  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:18px 2px;
}

.empty-cart{
  min-height:250px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:#777;
}

.empty-cart-icon{
  width:65px;
  height:65px;

  margin-bottom:18px;

  border:1px solid var(--border);

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#555;

  font-size:22px;
}

.empty-cart-title{
  font-family:var(--heading);

  font-size:18px;

  color:#aaa;

  margin-bottom:7px;
}

.empty-cart-text{
  font-size:10px;

  color:#555;

  letter-spacing:.5px;
}

/* =========================================================
   CART ITEM
========================================================= */

.cart-item{
  position:relative;

  display:grid;

  grid-template-columns:66px 1fr 28px;

  gap:12px;

  align-items:center;

  padding:11px;

  margin-bottom:10px;

  background:#101010;

  border:1px solid var(--border);

  border-radius:8px;

  transition:
    border-color .2s ease,
    background .2s ease;
}

.cart-item:hover{
  border-color:rgba(210,15,29,.25);

  background:#121212;
}

.cart-item-image{
  width:66px;
  height:66px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#080808;

  border-radius:5px;

  overflow:hidden;
}

.cart-item-image img{
  width:100%;
  height:100%;

  object-fit:contain;
}

.cart-item-info{
  min-width:0;
}

.cart-item-name{
  font-family:var(--heading);

  color:#eee;

  font-size:12px;

  line-height:1.35;

  margin-bottom:4px;
}

.cart-item-price{
  color:var(--red);

  font-size:11px;

  font-weight:600;

  margin-bottom:7px;
}

.qty{
  display:flex;

  align-items:center;

  gap:7px;
}

.qty button{
  width:23px;
  height:23px;

  border:1px solid var(--border);

  background:#181818;

  color:#fff;

  border-radius:3px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.2s;
}

.qty button:hover{
  background:var(--red);

  border-color:var(--red);
}

.qty-number{
  min-width:18px;

  text-align:center;

  color:#ccc;

  font-size:11px;
}

.remove-item{
  width:27px;
  height:27px;

  border:0;

  background:transparent;

  color:#555;

  cursor:pointer;

  font-size:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.2s;
}

.remove-item:hover{
  color:var(--red);
}

/* =========================================================
   CART FOOTER
========================================================= */

.cart-footer{
  flex:0 0 auto;

  padding-top:18px;

  border-top:1px solid var(--border);
}

.total{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:15px;

  font-family:var(--subheading);

  font-size:12px;

  letter-spacing:1.5px;
}

.total-value{
  color:#fff;

  font-size:17px;

  font-family:var(--body);

  font-weight:600;

  letter-spacing:0;
}

.checkout{
  width:100%;
  height:49px;

  border:0;

  background:
    linear-gradient(
      180deg,
      #e9232f,
      #b90b15
    );

  color:#fff;

  font-size:11px;

  font-weight:700;

  letter-spacing:2px;

  cursor:pointer;

  border-radius:5px;

  transition:.25s;
}

.checkout:hover{
  filter:brightness(1.08);

  transform:translateY(-1px);
}

.checkout:active{
  transform:scale(.98);
}

.continue-shopping{
  width:100%;

  margin-top:10px;

  height:38px;

  border:1px solid var(--border);

  background:transparent;

  color:#aaa;

  font-size:9px;

  letter-spacing:1.5px;

  cursor:pointer;

  border-radius:5px;

  transition:.2s;
}

.continue-shopping:hover{
  color:#fff;

  border-color:#777;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  left:50%;
  bottom:25px;

  z-index:2000;

  transform:
    translate(-50%,20px);

  opacity:0;
  visibility:hidden;

  padding:12px 18px;

  border:1px solid rgba(255,255,255,.12);

  background:rgba(15,15,15,.96);

  color:#fff;

  border-radius:5px;

  font-size:10px;

  letter-spacing:.8px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.4);

  transition:
    opacity .25s ease,
    transform .25s ease,
    visibility .25s ease;
}

.toast.show{
  opacity:1;
  visibility:visible;

  transform:
    translate(-50%,0);
}

/* =========================================================
   TABLET
========================================================= */

@media(max-width:768px){

  header{
    height:76px;

    grid-template-columns:55px 1fr 55px;

    padding:0 7px;
  }

  .logo img{
    width:108px;
  }

  .menu-btn,
  .cart-btn{
    width:31px;
    height:31px;
  }

  .menu-btn svg,
  .cart-btn svg{
    width:20px;
    height:20px;
  }

  .cart-count{
    min-width:16px;
    height:16px;

    top:-3px;
    right:-5px;

    font-size:7px;
  }

  .products-page{
    width:100%;

    padding:
      28px
      17px
      75px;
  }

  .page-title{
    font-size:25px;

    letter-spacing:.8px;

    margin-bottom:8px;
  }

  .title-decoration{
    margin-bottom:25px;
  }

  .title-decoration span{
    width:55px;
  }

  .title-decoration b{
    font-size:18px;
  }

  .product-card{
    grid-template-columns:44% 56%;

    min-height:200px;

    border-radius:11px;
  }

  .product-image{
    min-height:200px;

    padding:5px;
  }

  .product-image img{
    height:175px;
  }

  .product-info{
    padding:
      16px
      11px
      16px
      6px;
  }

  .product-badge{
    font-size:7px;

    margin-bottom:6px;
  }

  .product-name{
    font-size:12px;

    line-height:1.3;

    margin-bottom:6px;
  }

  .product-description{
    font-size:9px;

    line-height:1.55;

    margin-bottom:7px;
  }

  .product-price{
    font-size:16px;

    margin-bottom:9px;
  }

  .add-btn,
  .sold-out{
    width:100%;

    height:30px;

    font-size:9px;
  }

  .cart-drawer{
    width:100%;

    max-width:none;

    right:-105%;

    padding:
      22px
      18px
      18px;
  }

  .cart-drawer.active{
    right:0;
  }

  .menu-drawer{
    width:320px;

    max-width:86vw;

    padding:24px;
  }
}

/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:480px){

  header{
    height:72px;

    grid-template-columns:52px 1fr 52px;
  }

  .logo img{
    width:100px;
  }

  .menu-btn,
  .cart-btn{
    width:29px;
    height:29px;
  }

  .menu-btn svg,
  .cart-btn svg{
    width:19px;
    height:19px;
  }

  .cart-count{
    min-width:15px;
    width:15px;
    height:15px;

    top:-4px;
    right:-5px;

    padding:0;

    font-size:7px;
  }

  .products-page{
    padding:
      25px
      14px
      65px;
  }

  .page-title{
    font-size:20px;

    margin-top:-3px;
  }

  .title-decoration{
    gap:9px;

    margin-bottom:22px;
  }

  .title-decoration span{
    width:48px;
  }

  .product-card{
    grid-template-columns:43% 57%;

    min-height:185px;

    border-radius:10px;
  }

  .product-image{
    min-height:185px;
  }

  .product-image img{
    height:160px;
  }

  .product-info{
    padding:
      14px
      9px
      14px
      6px;
  }

  .product-badge{
    font-size:6.5px;
  }

  .product-name{
    font-size:11px;
  }

  .product-description{
    font-size:8px;
  }

  .product-price{
    font-size:14px;
  }

  .add-btn,
  .sold-out{
    height:28px;

/* =========================================================

========================================================= */

const soldOut = [];


/* =========================================================
   CART STORAGE
========================================================= */

/*
   IMPORTANT:

   Keep this exact storage key on index.html too:

   ap_user_cart

   That means the cart can be shared between
   index.html and shop.html.
*/

const CART_KEY = "ap_user_cart";


let cart = [];

try{

  cart =
    JSON.parse(
      localStorage.getItem(CART_KEY)
    ) || [];

  if(!Array.isArray(cart)){
    cart = [];
  }

}catch(error){

  cart = [];

}


/* =========================================================
   SAVE CART
========================================================= */

function saveCart(){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


/* =========================================================
   PRODUCT RENDER
========================================================= */

function renderProducts(){

  const list =
    document.getElementById("product-list");


  list.innerHTML =
    products.map(product => {

      const sold =
        soldOut.includes(product.id);


      return `

        <article class="product-card">

          <a
            class="product-image"
            href="${product.url}"
            target="_blank"
            rel="noopener"
          >

            <img
              src="${product.image}"
              alt="${escapeHTML(product.name)}"
              loading="lazy"
              onerror="this.style.opacity='.25'"
            >

          </a>


          <div class="product-info">

            <div class="product-badge">
              ${escapeHTML(product.badge)}
            </div>

            </h2>

            </p>


            <div class="product-price">

            </div>

              </div>
              `

              >

                <svg viewBox="0 0 32 32">
                  <path d="M4 6h4l3.1 14.2a2 2 0 0 0 2 1.6h10.8a2 2 0 0 0 1.9-1.4L29 11H9"/>

    }).join("");

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(id){

  const product =
    products.find(
      item => item.id === id
    );


  if(!product){
    return;
  }


  const existing =
    cart.find(
      item => item.id === id
    );


  if(existing){

    existing.qty += 1;

  }else{

    cart.push({

      ...product,

      qty:1

    });

  }


  saveCart();

  updateCart();

  animateCartCount();

  showToast(
    product.name + " added to cart"
  );

  openCart();

}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

function changeQty(id, amount){

  const item =
    cart.find(
      product => product.id === id
    );


  if(!item){
    return;
  }


  item.qty += amount;


  if(item.qty <= 0){

    cart =
      cart.filter(
        product => product.id !== id
      );

  }


  saveCart();

  updateCart();

}


/* =========================================================
   REMOVE PRODUCT
========================================================= */

function removeItem(id){

  const item =
    cart.find(
      product => product.id === id
    );


  cart =
    cart.filter(
      product => product.id !== id
    );


  saveCart();

  updateCart();


  if(item){

    showToast(
      item.name + " removed"
    );

  }

}


/* =========================================================
   UPDATE CART
========================================================= */

function updateCart(){

  const count =
    cart.reduce(
      (total,item) =>
        total + item.qty,
      0
    );


  const countElement =
    document.getElementById(
      "cart-count"
    );


  countElement.textContent =
    count > 99
      ? "99+"
      : count;


  const subtotal =
    cart.reduce(
      (total,item) =>
        total +
        (
          Number(item.price) *
          Number(item.qty)
        ),
      0
    );


  document.getElementById(
    "subtotal"
  ).textContent =
    "$" + formatPrice(subtotal);


  renderCartItems();

}


/* =========================================================
   RENDER CART ITEMS
========================================================= */

function renderCartItems(){

  const box =
    document.getElementById(
      "cart-items"
    );


  if(!cart.length){

    box.innerHTML = `

      <div class="empty-cart">

        <div class="empty-cart-icon">
          🛒
        </div>

        <div class="empty-cart-title">
          YOUR CART IS EMPTY
        </div>

        <div class="empty-cart-text">
          ADD SOMETHING YOU LOVE.
        </div>

      </div>

    `;

    return;

  }


  box.innerHTML =
    cart.map(item => `

      <div class="cart-item">

        <div class="cart-item-image">

          <img
            src="${item.image}"
            alt="${escapeHTML(item.name)}"
            onerror="this.style.opacity='.25'"
          >

        </div>


        <div class="cart-item-info">

          <div class="cart-item-name">
            ${escapeHTML(item.name)}
          </div>


          <div class="cart-item-price">
            $${formatPrice(item.price)}
          </div>


          <div class="qty">

            <button
              onclick="changeQty(${item.id},-1)"
              aria-label="Decrease quantity"
            >
              −
            </button>


            <span class="qty-number">
              ${item.qty}
            </span>


            <button
              onclick="changeQty(${item.id},1)"
              aria-label="Increase quantity"
            >
              +
            </button>

          </div>

        </div>


        <button
          class="remove-item"
          onclick="removeItem(${item.id})"
          aria-label="Remove item"
        >
          ×
        </button>

      </div>

    `).join("");

}

    document.body.classList.remove(

    );

========================================================= */

function animateCartCount(){

  const count =
    document.getElementById(
      "cart-count"
    );


  count.classList.remove(
    "bump"
  );


  void count.offsetWidth;


  count.classList.add(
    "bump"
  );

}


/* =========================================================
   TOAST MESSAGE
========================================================= */

let toastTimer;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    },2200);

}


/* =========================================================
   CHECKOUT
========================================================= */

function checkout(){

  if(!cart.length){

    showToast(
      "YOUR CART IS EMPTY"
    );

    return;

  }


  /*
    Change this URL later to your
    real checkout/payment page.
  */

  window.location.href =
    "index.html#checkout";

}


/* =========================================================
   PRICE FORMAT
========================================================= */

function formatPrice(price){

  return Number(price)
    .toLocaleString(
      "en-US"
    );

}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeAllDrawers();

    }

  }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

renderProducts();

updateCart();


/* =========================================================
   KEEP CART UPDATED IF ANOTHER TAB CHANGES IT
========================================================= */

window.addEventListener(
  "storage",
  event => {

    if(event.key !== CART_KEY){
      return;
    }


    try{

      cart =
        JSON.parse(
          event.newValue
        ) || [];

    }catch(error){

      cart = [];

    }


    updateCart();

  }
);

</script>
