<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products — Abdullah Psychotic</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
:root{
  --red:#d20f1d;
  --red-dark:#9e0914;
  --bg:#050505;
  --card:#101010;
  --muted:#8c8c8c;
  --white:#f5f5f5;
  --border:rgba(255,255,255,.12);
  --heading:"Playfair Display",serif;
  --subheading:"Cinzel",serif;
  --body:"Montserrat",sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  background:
    radial-gradient(circle at 50% 20%,rgba(110,0,0,.08),transparent 35%),
    #050505;
  color:var(--white);
  font-family:var(--body);
  overflow-x:hidden;
}

a{text-decoration:none;color:inherit}

button{font-family:inherit}

::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-track{background:#050505}
::-webkit-scrollbar-thumb{background:var(--red);border-radius:10px}

/* =========================
   HEADER — reference style
========================= */
header{
  position:sticky;
  top:0;
  z-index:1000;
  height:112px;
  display:grid;
  grid-template-columns:90px 1fr 90px;
  align-items:center;
  background:rgba(0,0,0,.94);
  border-bottom:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(12px);
}

.menu-btn,.cart-btn{
  position:relative;
  width:44px;
  height:44px;
  margin:0 auto;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f4f4f4;
  cursor:pointer;
  transition:transform .2s ease,color .2s ease,opacity .2s ease;
  -webkit-tap-highlight-color:transparent;
}

.menu-btn:hover,.cart-btn:hover{
  background:transparent;
  border-color:transparent;
  color:#fff;
  transform:scale(1.06);
}

.menu-btn:active,.cart-btn:active{transform:scale(.92)}

.menu-btn i,.cart-btn i{
  font-size:31px;
  font-weight:300;
}

.menu-btn i{
  font-size:0;
  width:31px;
  height:23px;
  position:relative;
}

.menu-btn i::before,
.menu-btn i::after{
  content:"";
  position:absolute;
  left:0;
  width:31px;
  height:2px;
  background:#f5f5f5;
  border-radius:2px;
}

.menu-btn i::before{
  top:1px;
  box-shadow:0 10px 0 #f5f5f5, 0 20px 0 #f5f5f5;
}

.menu-btn i::after{display:none}

.logo{
  justify-self:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1;
  user-select:none;
}

.logo-main{
  color:#f7f7f7;
  font-family:var(--body);
  font-size:31px;
  font-weight:400;
  letter-spacing:13px;
  margin-left:13px;
}

.logo-sub{
  color:var(--red);
  font-family:var(--body);
  font-size:23px;
  font-weight:500;
  letter-spacing:9px;
  margin-left:9px;
  margin-top:11px;
}

.cart-btn i{
  font-size:30px;
  line-height:1;
}

.cart-count{
  position:absolute;
  top:1px;
  right:1px;
  min-width:25px;
  height:25px;
  padding:0 6px;
  border:2px solid #000;
  border-radius:50%;
  background:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-family:var(--body);
  font-size:12px;
  font-weight:600;
  line-height:1;
  box-shadow:none;
}

/* =========================
   MENU DRAWER
========================= */
.menu-drawer{
  position:fixed;
  top:0;
  left:-360px;
  width:340px;
  max-width:88vw;
  height:100dvh;
  z-index:1200;
  background:rgba(8,8,8,.98);
  border-right:1px solid rgba(255,255,255,.11);
  box-shadow:18px 0 55px rgba(0,0,0,.45);
  padding:28px;
  display:flex;
  flex-direction:column;
  transition:left .42s cubic-bezier(.77,0,.175,1);
}

.menu-drawer.active{left:0}

.menu-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:22px;
  border-bottom:1px solid var(--border);
}

.menu-brand{
  font-family:var(--subheading);
  font-size:12px;
  letter-spacing:2px;
}

.menu-close{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:50%;
  background:#111;
  color:#aaa;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.25s;
}

.menu-close:hover{color:#fff;border-color:var(--red)}

.menu-links{
  display:flex;
  flex-direction:column;
  gap:5px;
  padding-top:24px;
}

.menu-links a{
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px 14px;
  color:#bbb;
  border-radius:9px;
  font-size:13px;
  letter-spacing:1.5px;
  transition:.25s;
}

.menu-links a i{
  width:20px;
  text-align:center;
  color:var(--red);
}

.menu-links a:hover{
  color:#fff;
  background:rgba(210,15,29,.10);
  padding-left:18px;
}

.menu-bottom{
  margin-top:auto;
  color:#666;
  font-size:10px;
  letter-spacing:2px;
  text-align:center;
}

/* =========================
   PAGE TITLE
========================= */
.products-page{
  width:min(100%,1100px);
  margin:0 auto;
  padding:30px 28px 90px;
}

.page-title{
  text-align:center;
  font-family:var(--heading);
  font-size:46px;
  font-weight:500;
  letter-spacing:1px;
  margin:0 0 14px;
}

.title-decoration{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:38px;
}

.title-decoration span{
  display:block;
  width:74px;
  height:2px;
  background:var(--red);
}

.title-decoration i{
  color:var(--red);
  font-size:18px;
}

/* =========================
   PRODUCT LIST
========================= */
.product-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.product-card{
  min-height:300px;
  display:grid;
  grid-template-columns:44% 56%;
  overflow:hidden;
  background:
    radial-gradient(circle at 25% 50%,rgba(255,255,255,.035),transparent 42%),
    linear-gradient(135deg,#111 0%,#0c0c0c 100%);
  border:1px solid var(--border);
  border-radius:20px;
  transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;
}

.product-card:hover{
  transform:translateY(-2px);
  border-color:rgba(210,15,29,.38);
  box-shadow:0 18px 45px rgba(0,0,0,.5);
}

.product-image{
  position:relative;
  min-height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  overflow:hidden;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.045),transparent 60%);
}

.product-image::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 70%,rgba(0,0,0,.18));
  pointer-events:none;
}

.product-image img{
  width:100%;
  height:270px;
  object-fit:contain;
  position:relative;
  z-index:1;
  filter:drop-shadow(0 15px 20px rgba(0,0,0,.6));
  transition:transform .5s ease;
}

.product-card:hover .product-image img{
  transform:scale(1.035);
}

.product-info{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:34px 52px 34px 20px;
}

.product-badge{
  color:var(--red);
  font-size:13px;
  font-weight:500;
  letter-spacing:.8px;
  text-transform:uppercase;
  margin-bottom:12px;
}

.product-name{
  font-family:var(--heading);
  font-size:27px;
  line-height:1.25;
  font-weight:500;
  margin-bottom:11px;
}

.product-description{
  color:#9a9a9a;
  font-size:17px;
  line-height:1.85;
  margin-bottom:15px;
}

.product-price{
  color:#f22935;
  font-size:27px;
  font-weight:500;
  margin-bottom:18px;
}

.add-btn{
  width:255px;
  max-width:100%;
  height:52px;
  border:0;
  border-radius:8px;
  background:linear-gradient(180deg,#ed2935 0%,#c30c17 100%);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 8px 20px rgba(193,18,31,.12);
}

.add-btn:hover{
  background:linear-gradient(180deg,#ff3441 0%,#a90812 100%);
  transform:translateY(-1px);
  box-shadow:0 10px 25px rgba(193,18,31,.24);
}

.add-btn i{font-size:21px}

.sold-out{
  width:255px;
  max-width:100%;
  height:52px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.15);
  background:#eee;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:700;
  letter-spacing:1.5px;
}

/* =========================
   CART DRAWER
========================= */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(5px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:1100;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

.cart-drawer{
  position:fixed;
  top:0;
  right:-440px;
  width:410px;
  max-width:94vw;
  height:100dvh;
  background:rgba(8,8,8,.98);
  border-left:1px solid var(--border);
  z-index:1200;
  display:flex;
  flex-direction:column;
  padding:28px;
  box-shadow:-18px 0 55px rgba(0,0,0,.45);
  transition:right .42s cubic-bezier(.77,0,.175,1);
}

.cart-drawer.active{right:0}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:18px;
  border-bottom:1px solid var(--border);
}

.cart-header h2{
  font-family:var(--subheading);
  font-size:15px;
  letter-spacing:2.5px;
}

.close{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  font-size:17px;
  cursor:pointer;
  transition:.25s;
}

.close:hover{color:#fff;border-color:var(--red);background:rgba(210,15,29,.10)}

.cart-items{
  flex:1;
  overflow-y:auto;
  padding:18px 0;
}

.empty{
  text-align:center;
  color:#777;
  margin-top:50px;
  font-family:var(--heading);
}

.cart-item{
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px;
  margin-bottom:12px;
  border:1px solid var(--border);
  background:#111;
  border-radius:7px;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:contain;
  background:#0b0b0b;
  border-radius:5px;
}

.cart-item-info{flex:1}

.cart-item-name{
  font-family:var(--heading);
  font-size:13px;
  line-height:1.3;
}

.cart-item-price{
  color:var(--red);
  font-size:13px;
  margin-top:5px;
}

.qty{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:8px;
}

.qty button{
  width:24px;
  height:24px;
  border:1px solid var(--border);
  background:#191919;
  color:#fff;
  cursor:pointer;
}

.remove{
  color:#777;
  cursor:pointer;
}

.remove:hover{color:var(--red)}

.cart-footer{
  border-top:1px solid var(--border);
  padding-top:18px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-family:var(--subheading);
  font-size:15px;
  margin-bottom:16px;
}

.checkout{
  width:100%;
  height:48px;
  border:0;
  background:var(--red);
  color:#fff;
  font-weight:600;
  letter-spacing:2px;
  cursor:pointer;
}

/* =========================
   MOBILE
========================= */
@media(max-width:768px){
  header{
    height:84px;
    padding:0 20px;
  }

  .logo-main{
    font-size:28px;
    letter-spacing:10px;
    margin-left:10px;
  }

  .logo-sub{
    font-size:20px;
    letter-spacing:7px;
    margin-left:7px;
  }

  .products-page{
    padding:27px 45px 70px;
  }

  .page-title{
    font-size:41px;
    white-space:nowrap;
  }

  .title-decoration{margin-bottom:38px}

  .product-list{gap:10px}

  .product-card{
    grid-template-columns:44% 56%;
    min-height:300px;
    border-radius:18px;
  }

  .product-image{
    min-height:300px;
    padding:8px;
  }

  .product-image img{height:255px}

  .product-info{
    padding:28px 20px 28px 8px;
  }

  .product-badge{
    font-size:11px;
    margin-bottom:9px;
  }

  .product-name{
    font-size:20px;
    line-height:1.25;
    margin-bottom:9px;
  }

  .product-description{
    font-size:14px;
    line-height:1.9;
    margin-bottom:10px;
  }

  .product-price{
    font-size:24px;
    margin-bottom:16px;
  }

  .add-btn,.sold-out{
    width:100%;
    height:52px;
    font-size:15px;
  }
}

@media(max-width:480px){
  header{
    padding:0 16px;
  }

  .menu-btn,.cart-btn{
    width:46px;
    height:46px;
  }

  .menu-btn i,.cart-btn i{font-size:18px}

  .logo-main{
    font-size:23px;
    letter-spacing:7px;
    margin-left:7px;
  }

  .logo-sub{
    font-size:17px;
    letter-spacing:5px;
    margin-left:5px;
  }

  .products-page{
    padding:25px 18px 60px;
  }

  .page-title{
    font-size:32px;
  }

  .title-decoration span{width:58px}

  .product-card{
    min-height:260px;
    grid-template-columns:43% 57%;
  }

  .product-image{min-height:260px}

  .product-image img{height:220px}

  .product-info{
    padding:22px 14px 22px 7px;
  }

  .product-badge{font-size:9px}

  .product-name{font-size:17px}

  .product-description{
    font-size:12px;
    line-height:1.75;
  }

  .product-price{
    font-size:21px;
  }

  .add-btn,.sold-out{
    height:45px;
    font-size:12px;
    gap:8px;
  }

  .add-btn i{font-size:16px}
}

/* =========================
   REFERENCE IMAGE TUNING
========================= */
@media(min-width:769px){
  .product-card{
    grid-template-columns:46% 54%;
    min-height:300px;
    border-radius:19px;
  }

  .product-image{
    min-height:300px;
    padding:10px 18px;
  }

  .product-image img{
    height:285px;
  }

  .product-info{
    padding:30px 42px 30px 12px;
  }

  .product-badge{
    font-size:13px;
    margin-bottom:12px;
  }

  .product-name{
    font-size:25px;
    margin-bottom:10px;
  }

  .product-description{
    font-size:17px;
    line-height:1.85;
  }

  .product-price{
    font-size:27px;
  }

  .add-btn{
    width:255px;
    height:52px;
    border-radius:7px;
    font-size:18px;
  }
}

@media(max-width:768px){
  header{
    height:112px;
    grid-template-columns:76px 1fr 76px;
    padding:0;
  }

  .menu-btn,.cart-btn{
    width:42px;
    height:42px;
  }

  .menu-btn i{
    width:24px;
    height:16px;
  }

  .menu-btn i::before{
    width:29px;
    box-shadow:0 9px 0 #f5f5f5, 0 18px 0 #f5f5f5;
  }

  .cart-btn i{font-size:22px}

  .cart-count{
    top:0;
    right:0;
    min-width:24px;
    height:24px;
    font-size:11px;
  }

  .logo-main{
    font-size:29px;
    letter-spacing:11px;
    margin-left:11px;
  }

  .logo-sub{
    font-size:22px;
    letter-spacing:8px;
    margin-left:8px;
    margin-top:10px;
  }

  .products-page{
    padding:30px 44px 70px;
  }

  .page-title{
    font-size:42px;
    letter-spacing:.5px;
  }

  .product-card{
    grid-template-columns:46% 54%;
    min-height:300px;
  }

  .product-image{
    min-height:300px;
    padding:8px;
  }

  .product-image img{height:270px}

  .product-info{
    padding:28px 20px 28px 8px;
  }
}

@media(max-width:480px){
  header{
    height:86px;
    grid-template-columns:62px 1fr 62px;
  }

  .menu-btn,.cart-btn{
    width:46px;
    height:46px;
  }

  .menu-btn i{
    width:27px;
    height:20px;
  }

  .menu-btn i::before{
    width:27px;
    height:2px;
    box-shadow:0 8px 0 #f5f5f5, 0 16px 0 #f5f5f5;
  }

  .cart-btn i{font-size:25px}

  .cart-count{
    min-width:21px;
    height:21px;
    top:0;
    right:0;
    font-size:10px;
    border-width:1px;
  }

  .logo-main{
    font-size:20px;
    letter-spacing:6px;
    margin-left:6px;
  }

  .logo-sub{
    font-size:15px;
    letter-spacing:4.5px;
    margin-left:4.5px;
    margin-top:8px;
  }

  .products-page{
    padding:25px 18px 60px;
  }

  .page-title{font-size:31px}

  .product-card{
    grid-template-columns:44% 56%;
    min-height:260px;
  }

  .product-image{min-height:260px}
  .product-image img{height:225px}

  .product-info{
    padding:21px 13px 21px 7px;
  }
}


/* FINAL REFERENCE FIX — no external icon dependency */
.menu-btn svg,
.cart-btn svg,
.add-btn svg{
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.menu-btn svg{
  width:34px;
  height:26px;
}

.cart-btn svg{
  width:34px;
  height:34px;
}

.add-btn svg{
  width:24px;
  height:24px;
  flex:0 0 auto;
}

.title-decoration b{
  color:var(--red);
  font-size:28px;
  line-height:1;
  font-family:Georgia,serif;
  font-weight:400;
  transform:rotate(45deg);
  display:block;
}

  header{
    height:80px;
    grid-template-columns:62px 1fr 62px;

  }

  .menu-btn,.cart-btn{

  }

  }

    font-size:12px;

    margin-left:5px;
    margin-top:8px;
  }

  .products-page{
    width:100%;
    padding:30px 17px 70px;
  }

  .page-title{
    font-size:31px;

  }

  .title-decoration{
    gap:10px;
    margin-bottom:34px;
  }

  .title-decoration span{width:58px}
  .title-decoration b{font-size:22px}

  .product-list{gap:10px}

  .product-card{
    grid-template-columns:44% 56%;
    min-height:244px;
    border-radius:18px;
  }

  .product-image{
    min-height:244px;
    padding:8px;
  }

  .product-image img{
    height:220px;
  }

  .product-info{
    padding:24px 14px 24px 8px;
  }

  .product-badge{
    font-size:10px;
    letter-spacing:1px;
    margin-bottom:9px;
  }

  .product-name{
    font-size:17px;
    line-height:1.3;
    margin-bottom:9px;

/* Same sold-out IDs from your current website */
const soldOut = [];

let cart = JSON.parse(localStorage.getItem("ap_user_cart")) || [];

function saveCart(){
  localStorage.setItem("ap_user_cart",JSON.stringify(cart));
}

function renderProducts(){
  const list = document.getElementById("product-list");

  list.innerHTML = products.map(product => {
    const sold = soldOut.includes(product.id);

    return `
      <article class="product-card">
        <a class="product-image" href="${product.image}" target="_blank">
          <img src="${product.image}" alt="${product.name}" loading="lazy">
        </a>

        <div class="product-info">
          <div class="product-badge">${product.badge}</div>
          <h2 class="product-name">${product.name}</h2>
          <p class="product-description">${product.desc}</p>
          <div class="product-price">$${product.price.toLocaleString(undefined,{minimumFractionDigits: product.price % 1 ? 2 : 0, maximumFractionDigits: 2})}</div>

          ${
            sold
            ? `<div class="sold-out">SOLD OUT</div>`
            : `<button class="add-btn" onclick="addToCart(${product.id})">
                 <svg viewBox="0 0 32 32" aria-hidden="true">
                   <path d="M4 6h4l3.1 14.2a2 2 0 0 0 2 1.6h10.8a2 2 0 0 0 1.9-1.4L29 11H9"/>
                   <circle cx="13" cy="27" r="1.8"/>
                   <circle cx="25" cy="27" r="1.8"/>
                 </svg>
                 <span>ADD TO CART</span>
               </button>`
          }
        </div>
      </article>
    `;
  }).join("");
}

function addToCart(id){
  const product = products.find(p => p.id === id);
  if(!product) return;

  const existing = cart.find(item => item.id === id);

  if(existing){
    existing.qty++;
  }else{
    cart.push({...product,qty:1});
  }

  saveCart();
  updateCart();
  openCart();
}

function changeQty(id,amount){
  const item = cart.find(p => p.id === id);
  if(!item) return;

  item.qty += amount;

  if(item.qty <= 0){
    cart = cart.filter(p => p.id !== id);
  }

  saveCart();
  updateCart();
}

function removeItem(id){
  cart = cart.filter(p => p.id !== id);
  saveCart();
  updateCart();
}

function updateCart(){
  const count = cart.reduce((sum,item)=>sum+item.qty,0);
  document.getElementById("cart-count").textContent = count;

  const subtotal = cart.reduce((sum,item)=>sum+(item.price*item.qty),0);
  document.getElementById("subtotal").textContent = "$" + subtotal.toLocaleString();

  const box = document.getElementById("cart-items");

  if(!cart.length){
    box.innerHTML = `<div class="empty">Your shopping bag is empty.</div>`;
    return;
  }

  box.innerHTML = cart.map(item => `
    <div class="cart-item">
      <img src="${item.image}" alt="${item.name}">
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">$${item.price.toLocaleString(undefined,{minimumFractionDigits: item.price % 1 ? 2 : 0, maximumFractionDigits: 2})}</div>
        <div class="qty">
          <button onclick="changeQty(${item.id},-1)">−</button>
          <span>${item.qty}</span>
          <button onclick="changeQty(${item.id},1)">+</button>
        </div>
      </div>
      <i class="fas fa-trash remove" onclick="removeItem(${item.id})"></i>
    </div>
  `).join("");
}

function openMenu(){
  document.getElementById("menu-drawer").classList.add("active");
  document.getElementById("menu-overlay").classList.add("active");
  document.body.style.overflow="hidden";
}

function closeMenu(){
  document.getElementById("menu-drawer").classList.remove("active");
  document.getElementById("menu-overlay").classList.remove("active");
  if(!document.getElementById("cart-drawer").classList.contains("active")){
    document.body.style.overflow="";
  }
}

function openCart(){
  closeMenu();
  document.getElementById("cart-drawer").classList.add("active");
  document.getElementById("overlay").classList.add("active");
  document.body.style.overflow="hidden";
}

function closeCart(){
  document.getElementById("cart-drawer").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
  document.body.style.overflow="";
}

function checkout(){
  if(!cart.length){
    alert("Your cart is empty!");
    return;

}
